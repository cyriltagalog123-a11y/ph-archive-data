name: PH Archive daily source-link collection
on:
  workflow_dispatch:
  schedule:
    # 04:19 UTC is 12:19 in the Philippines.
    - cron: '19 4 * * *'
permissions:
  contents: write
concurrency:
  group: ph-archive-ingest
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch publisher feeds, validate and deduplicate
        run: python scheduled_sync.py --root data
      - name: Commit index and immutable daily snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/snapshots
          if git diff --staged --quiet; then
            echo 'No archive changes to commit.'
          else
            git commit -m "Archive source-linked feed metadata: $(date -u +%F)"
            git push
          fi
